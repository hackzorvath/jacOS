<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | The Void</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            position: relative;
            overflow: hidden;
            background: #000;
            color: #d8ffd8;
            font-family: "Courier New", Courier, monospace;
        }

        #void-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            background: #000;
        }

        .content {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100%;

            display: grid;
            place-items: center;

            padding: 24px;
            text-align: center;
        }

        .copy {
            max-width: 700px;
        }

        .error-code {
            margin: 0 0 20px;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.18em;
            color: rgba(220, 255, 220, 0.88);
            text-shadow: 0 0 14px rgba(120, 255, 120, 0.15);
        }

        .message {
            margin: 0;
            font-size: clamp(1rem, 2.2vw, 1.35rem);
            line-height: 1.8;
            letter-spacing: 0.04em;
            color: rgba(220, 255, 220, 0.85);
        }

        .aside {
            margin-top: 20px;
            opacity: 0.45;
            font-size: 0.84rem;
            font-style: italic;
            color: rgba(220, 255, 220, 0.70);
        }

        .home-link {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;

            margin-top: 42px;
            padding: 8px 12px;

            color: #7dff7d;
            background: transparent;

            font-size: 0.98rem;
            line-height: 1.55;
            letter-spacing: 0.06em;
            text-align: left;
            text-decoration: none;

            opacity: 0.82;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.35);

            transition:
                color 180ms ease,
                opacity 180ms ease,
                text-shadow 180ms ease,
                transform 180ms ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            color: #eaffea;
            opacity: 1;
            outline: none;
            transform: translateY(-1px);
            text-shadow:
                0 0 12px rgba(120, 255, 120, 0.65),
                0 0 24px rgba(0, 255, 0, 0.28);
        }

        .cursor {
            animation: blink 1s steps(1) infinite;
        }

        .error-code,
        .message,
        .aside,
        .cursor {
            transition:
                color 180ms ease,
                text-shadow 180ms ease;
        }


        body.good-void .error-code {
            color: rgba(55, 32, 14, 0.88);

            text-shadow:
                0 0 14px rgba(255, 120, 0, 0.12);
        }


        body.good-void .message {
            color: rgba(45, 28, 14, 0.85);
        }


        body.good-void .aside {
            color: rgba(80, 48, 20, 0.70);
        }


        body.good-void .cursor {
            color: #d85d00;
        }


        body.good-void .home-link,
        body.good-void .home-link:hover,
        body.good-void .home-link:focus-visible {
            color: #d85d00;

            text-shadow:
                0 0 10px rgba(255, 120, 0, 0.28);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <canvas id="void-canvas" aria-hidden="true"></canvas>

    <main class="content">
        <div class="copy">
            <h1 class="error-code">404</h1>

            <p class="message">
                not found in the void... ever
                <br />
            <p class="aside">
                [this was an odd place to look]
            </p>
            <span class="cursor">j~_></span>
            <a class="home-link" href="/jacOS/" aria-label="Return to jacOS">
                <span>00 GOTO 10</span>
                <span>10 HOME:</span>
            </a>
            <div>[Running via WINE 11.0]</div>
        </div>
    </main>

    <script src="/jacOS/404-void.js"></script>
</body>

</html>
